<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestão de Gastos">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14213A">
<title>Gestão de Gastos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#14213A;
    --ink-soft:#5B6473;
    --paper:#F6F3EC;
    --paper-raised:#FFFFFF;
    --line:#DFD8C8;
    --sage:#3F6B52;
    --sage-soft:#E7EFE9;
    --rust:#A8462F;
    --rust-soft:#F4E7E2;
    --gold:#B08A3E;
    --gold-soft:#F1E8D3;
    --radius:14px;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    padding-bottom:92px;
  }
  .tabular{ font-variant-numeric: tabular-nums; }

  /* ---------- Header ---------- */
  header.top{
    background:var(--ink);
    color:var(--paper);
    padding:22px 20px 26px;
    border-radius:0 0 26px 26px;
  }
  .top-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  .brand{
    display:flex; align-items:baseline; gap:8px;
  }
  .brand .mark{
    font-family:var(--serif); font-weight:600; font-size:20px; letter-spacing:.2px;
  }
  .icon-btn{
    width:38px; height:38px; border-radius:50%;
    background:rgba(246,243,236,.12);
    border:1px solid rgba(246,243,236,.2);
    color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; cursor:pointer;
  }
  .month-nav{
    display:flex; align-items:center; justify-content:center; gap:14px;
    margin-bottom:10px;
  }
  .month-nav button{
    background:none; border:none; color:var(--paper); opacity:.7;
    font-size:18px; cursor:pointer; padding:4px 10px;
  }
  .month-nav .label{
    font-size:13px; letter-spacing:.4px; opacity:.85; text-transform:capitalize;
    min-width:140px; text-align:center;
  }
  .balance-figure{
    text-align:center; margin-top:6px;
  }
  .balance-figure .cap{ font-size:12.5px; opacity:.65; margin-bottom:4px; }
  .balance-figure .num{
    font-family:var(--serif); font-weight:600; font-size:40px; line-height:1;
  }
  .balance-figure .num.negative{ color:#E7A08C; }
  .mini-stats{
    display:flex; justify-content:center; gap:26px; margin-top:16px;
  }
  .mini-stats .item{ text-align:center; }
  .mini-stats .item .k{ font-size:11px; opacity:.6; margin-bottom:2px; }
  .mini-stats .item .v{ font-size:15px; font-weight:600; }
  .mini-stats .item.income .v{ color:#8FCBA6; }
  .mini-stats .item.expense .v{ color:#E7A08C; }

  /* ---------- Sections ---------- */
  .view{ display:none; padding:20px 18px 10px; }
  .view.active{ display:block; }

  .section-title{
    font-family:var(--serif); font-size:18px; font-weight:600; margin:0 0 12px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .section-title .add-link{
    font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--sage);
    cursor:pointer; border:none; background:none;
  }

  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:16px;
  }

  /* Category ledger bars */
  .cat-row{
    display:flex; align-items:center; gap:12px; padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .cat-row:last-child{ border-bottom:none; }
  .cat-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .cat-name{ flex:1; font-size:13.5px; }
  .cat-bar-track{ flex:1.4; height:6px; background:var(--paper); border-radius:4px; overflow:hidden; }
  .cat-bar-fill{ height:100%; border-radius:4px; }
  .cat-value{ font-size:13.5px; font-weight:600; min-width:74px; text-align:right; }
  .empty-note{
    color:var(--ink-soft); font-size:13px; text-align:center; padding:18px 6px;
  }

  .chart-wrap{ position:relative; height:190px; margin:4px auto 6px; }

  /* Transaction ledger list */
  .tx-row{
    display:flex; align-items:center; gap:12px; padding:11px 0;
    border-bottom:1px solid var(--line);
  }
  .tx-row:last-child{ border-bottom:none; }
  .tx-icon{
    width:36px; height:36px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:15px;
  }
  .tx-body{ flex:1; min-width:0; }
  .tx-desc{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tx-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .tx-value{ font-size:14px; font-weight:700; white-space:nowrap; }
  .tx-value.expense{ color:var(--rust); }
  .tx-value.income{ color:var(--sage); }
  .tx-del{ background:none; border:none; color:var(--ink-soft); font-size:16px; cursor:pointer; padding:2px 4px; margin-left:2px; }

  /* Debts & goals */
  .item-card{ margin-bottom:14px; }
  .item-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .item-head .name{ font-weight:600; font-size:14.5px; }
  .item-head .sub{ font-size:12px; color:var(--ink-soft); }
  .progress-track{ height:8px; background:var(--paper); border-radius:5px; overflow:hidden; margin-bottom:8px; }
  .progress-fill{ height:100%; border-radius:5px; background:var(--gold); }
  .item-foot{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); }
  .item-actions{ display:flex; gap:8px; margin-top:10px; }
  .btn-small{
    flex:1; padding:8px; border-radius:9px; border:1px solid var(--line);
    background:var(--paper); font-size:12.5px; font-weight:600; color:var(--ink);
    cursor:pointer;
  }
  .btn-small.primary{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .btn-small.danger{ color:var(--rust); }

  .budget-alert{
    font-size:11.5px; padding:4px 9px; border-radius:20px; font-weight:600;
    background:var(--rust-soft); color:var(--rust); display:inline-block;
  }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:78px; width:56px; height:56px; border-radius:50%;
    background:var(--ink); color:var(--paper); border:none;
    font-size:26px; box-shadow:0 8px 20px rgba(20,33,58,.35);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    max-width:480px; margin:0 auto; z-index:20;
  }

  /* ---------- Bottom nav ---------- */
  nav.bottom{
    position:fixed; bottom:0; left:0; right:0;
    max-width:480px; margin:0 auto;
    background:var(--paper-raised); border-top:1px solid var(--line);
    display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:15;
  }
  nav.bottom button{
    flex:1; background:none; border:none; display:flex; flex-direction:column;
    align-items:center; gap:3px; padding:6px 0; cursor:pointer; color:var(--ink-soft);
  }
  nav.bottom button .ic{ font-size:19px; }
  nav.bottom button .lb{ font-size:10.5px; font-weight:600; }
  nav.bottom button.active{ color:var(--ink); }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,33,58,.45);
    display:none; align-items:flex-end; justify-content:center; z-index:40;
  }
  .overlay.show{ display:flex; }
  .sheet{
    background:var(--paper); width:100%; max-width:480px;
    border-radius:22px 22px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto;
  }
  .sheet h3{ font-family:var(--serif); font-size:19px; margin:0 0 16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:600; }
  .field input, .field select{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper-raised); font-size:14.5px; font-family:var(--sans); color:var(--ink);
  }
  .field input:focus, .field select:focus{ outline:2px solid var(--ink); outline-offset:1px; }
  .type-toggle{ display:flex; gap:8px; margin-bottom:14px; }
  .type-toggle button{
    flex:1; padding:10px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper-raised); font-weight:600; font-size:13.5px; cursor:pointer; color:var(--ink-soft);
  }
  .type-toggle button.active.expense{ background:var(--rust-soft); border-color:var(--rust); color:var(--rust); }
  .type-toggle button.active.income{ background:var(--sage-soft); border-color:var(--sage); color:var(--sage); }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn-main{
    flex:1; padding:13px; border-radius:11px; border:none; background:var(--ink);
    color:var(--paper); font-weight:600; font-size:14.5px; cursor:pointer;
  }
  .btn-ghost{
    flex:1; padding:13px; border-radius:11px; border:1px solid var(--line); background:none;
    color:var(--ink-soft); font-weight:600; font-size:14.5px; cursor:pointer;
  }
  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:30px;
    font-size:13px; z-index:60; opacity:0; transition:opacity .25s;
    max-width:80%; text-align:center;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="top-row">
      <div class="brand"><span class="mark">Gestão de Gastos</span></div>
      <button class="icon-btn" onclick="openProfile()">⚙</button>
    </div>
    <div class="month-nav">
      <button onclick="shiftMonth(-1)">‹</button>
      <div class="label" id="monthLabel">—</div>
      <button onclick="shiftMonth(1)">›</button>
    </div>
    <div class="balance-figure">
      <div class="cap">Saldo do mês</div>
      <div class="num tabular" id="balanceNum">R$ 0,00</div>
    </div>
    <div class="mini-stats">
      <div class="item income"><div class="k">Entradas</div><div class="v tabular" id="incomeNum">R$ 0,00</div></div>
      <div class="item expense"><div class="k">Saídas</div><div class="v tabular" id="expenseNum">R$ 0,00</div></div>
    </div>
  </header>

  <!-- RESUMO -->
  <section class="view active" id="view-resumo">
    <div class="section-title">Por categoria</div>
    <div class="card">
      <div class="chart-wrap"><canvas id="catChart"></canvas></div>
      <div id="catList"></div>
    </div>

    <div class="section-title">Evolução (6 meses)</div>
    <div class="card">
      <div class="chart-wrap" style="height:160px;"><canvas id="trendChart"></canvas></div>
    </div>

    <div class="section-title">
      Últimos lançamentos
      <button class="add-link" onclick="openTx()">+ novo</button>
    </div>
    <div class="card" id="txList"></div>
  </section>

  <!-- DÍVIDAS -->
  <section class="view" id="view-dividas">
    <div class="section-title">
      Dívidas e parcelas
      <button class="add-link" onclick="openDebt()">+ nova</button>
    </div>
    <div id="debtList"></div>
  </section>

  <!-- METAS -->
  <section class="view" id="view-metas">
    <div class="section-title">
      Metas de economia
      <button class="add-link" onclick="openGoal()">+ nova</button>
    </div>
    <div id="goalList"></div>
  </section>

  <!-- PERFIL -->
  <section class="view" id="view-perfil">
    <div class="section-title">Meu perfil</div>
    <div class="card">
      <div class="field"><label>Nome completo</label><input id="pfName" placeholder="Seu nome"></div>
      <div class="field"><label>Telefone</label><input id="pfPhone" placeholder="(00) 00000-0000"></div>
      <div class="field"><label>Renda mensal (R$)</label><input id="pfIncome" type="number" placeholder="0,00"></div>
      <div class="field"><label>Principal objetivo financeiro</label><input id="pfGoal" placeholder="Ex: quitar dívidas"></div>
      <button class="btn-main" style="width:100%" onclick="saveProfile()">Salvar perfil</button>
    </div>
    <div class="card">
      <div class="section-title" style="margin-bottom:8px;">Dados</div>
      <button class="btn-small" style="width:100%; margin-bottom:8px;" onclick="exportData()">Exportar dados (.json)</button>
      <button class="btn-small danger" style="width:100%" onclick="confirmReset()">Apagar todos os dados</button>
    </div>
  </section>

  <button class="fab" onclick="openTx()">+</button>

  <nav class="bottom">
    <button class="active" data-view="resumo" onclick="switchView('resumo')"><span class="ic">📒</span><span class="lb">Resumo</span></button>
    <button data-view="dividas" onclick="switchView('dividas')"><span class="ic">📄</span><span class="lb">Dívidas</span></button>
    <button data-view="metas" onclick="switchView('metas')"><span class="ic">🎯</span><span class="lb">Metas</span></button>
    <button data-view="perfil" onclick="switchView('perfil')"><span class="ic">👤</span><span class="lb">Perfil</span></button>
  </nav>
</div>

<!-- Modal: transação -->
<div class="overlay" id="ovTx">
  <div class="sheet">
    <h3>Novo lançamento</h3>
    <div class="type-toggle">
      <button id="btnTypeExpense" class="active expense" onclick="setTxType('expense')">Despesa</button>
      <button id="btnTypeIncome" class="income" onclick="setTxType('income')">Receita</button>
    </div>
    <div class="field"><label>Descrição</label><input id="txDesc" placeholder="Ex: Supermercado"></div>
    <div class="field"><label>Valor (R$)</label><input id="txValue" type="number" step="0.01" placeholder="0,00"></div>
    <div class="field"><label>Data</label><input id="txDate" type="date"></div>
    <div class="field" id="txCatField"><label>Categoria</label>
      <select id="txCat"></select>
    </div>
    <div class="sheet-actions">
      <button class="btn-ghost" onclick="closeSheet('ovTx')">Cancelar</button>
      <button class="btn-main" onclick="saveTx()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: dívida -->
<div class="overlay" id="ovDebt">
  <div class="sheet">
    <h3>Nova dívida</h3>
    <div class="field"><label>Nome</label><input id="dbName" placeholder="Ex: Cartão Nubank"></div>
    <div class="field"><label>Valor total (R$)</label><input id="dbTotal" type="number" step="0.01" placeholder="0,00"></div>
    <div class="field"><label>Número de parcelas</label><input id="dbInstall" type="number" placeholder="Ex: 10"></div>
    <div class="field"><label>Parcelas já pagas</label><input id="dbPaid" type="number" placeholder="0" value="0"></div>
    <div class="sheet-actions">
      <button class="btn-ghost" onclick="closeSheet('ovDebt')">Cancelar</button>
      <button class="btn-main" onclick="saveDebt()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: meta -->
<div class="overlay" id="ovGoal">
  <div class="sheet">
    <h3>Nova meta</h3>
    <div class="field"><label>Nome</label><input id="glName" placeholder="Ex: Viagem de férias"></div>
    <div class="field"><label>Valor alvo (R$)</label><input id="glTarget" type="number" step="0.01" placeholder="0,00"></div>
    <div class="field"><label>Já economizado (R$)</label><input id="glSaved" type="number" step="0.01" placeholder="0,00" value="0"></div>
    <div class="sheet-actions">
      <button class="btn-ghost" onclick="closeSheet('ovGoal')">Cancelar</button>
      <button class="btn-main" onclick="saveGoal()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- Storage layer ---------------- */
const memFallback = {};
async function storeGet(key, def){
  try{
    const r = await window.storage.get(key, false);
    return r ? JSON.parse(r.value) : def;
  }catch(e){ return (key in memFallback) ? memFallback[key] : def; }
}
async function storeSet(key, value){
  memFallback[key] = value;
  try{ await window.storage.set(key, JSON.stringify(value), false); }
  catch(e){ /* keep in-memory fallback */ }
}

/* ---------------- State ---------------- */
let profile = { name:'', phone:'', income:0, goal:'' };
let transactions = []; // {id, type:'expense'|'income', desc, value, category, date}
let debts = [];        // {id, name, total, installments, paid}
let goals = [];        // {id, name, target, saved}
let currentDate = new Date();
let currentView = 'resumo';
let txType = 'expense';
let catChartInst = null, trendChartInst = null;

const EXPENSE_CATS = ['Moradia','Alimentação','Transporte','Contas fixas','Cartão de crédito','Lazer','Saúde','Educação','Outros'];
const INCOME_CATS = ['Salário','Freelance','Investimentos','Outros'];
const CAT_COLORS = {
  'Moradia':'#B08A3E','Alimentação':'#A8462F','Transporte':'#3F6B52','Contas fixas':'#5B6473',
  'Cartão de crédito':'#7A3B3B','Lazer':'#8C6BAF','Saúde':'#2E7D6B','Educação':'#3B6FA0','Outros':'#9A9184',
  'Salário':'#3F6B52','Freelance':'#3B6FA0','Investimentos':'#B08A3E'
};
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function fmtBRL(n){
  return (n<0?'-':'') + 'R$ ' + Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function closeSheet(id){ document.getElementById(id).classList.remove('show'); }
function openSheet(id){ document.getElementById(id).classList.add('show'); }

/* ---------------- Init ---------------- */
async function init(){
  profile = await storeGet('profile', profile);
  transactions = await storeGet('transactions', []);
  debts = await storeGet('debts', []);
  goals = await storeGet('goals', []);

  document.getElementById('pfName').value = profile.name || '';
  document.getElementById('pfPhone').value = profile.phone || '';
  document.getElementById('pfIncome').value = profile.income || '';
  document.getElementById('pfGoal').value = profile.goal || '';

  document.getElementById('txDate').valueAsDate = new Date();
  renderAll();
}

function switchView(v){
  currentView = v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
}
function openProfile(){ switchView('perfil'); document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.view==='perfil')); }

function shiftMonth(delta){
  currentDate.setMonth(currentDate.getMonth()+delta);
  renderAll();
}
function monthKey(d){ return d.getFullYear()+'-'+d.getMonth(); }
function txInMonth(t, d){
  const td = new Date(t.date+'T00:00:00');
  return td.getFullYear()===d.getFullYear() && td.getMonth()===d.getMonth();
}

/* ---------------- Render ---------------- */
function renderAll(){
  document.getElementById('monthLabel').textContent = MONTHS[currentDate.getMonth()] + ' de ' + currentDate.getFullYear();
  const monthTx = transactions.filter(t=>txInMonth(t, currentDate));
  const income = monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.value,0);
  const expense = monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.value,0);
  const balance = income - expense;

  const balEl = document.getElementById('balanceNum');
  balEl.textContent = fmtBRL(balance);
  balEl.classList.toggle('negative', balance<0);
  document.getElementById('incomeNum').textContent = fmtBRL(income);
  document.getElementById('expenseNum').textContent = fmtBRL(expense);

  renderCategoryCard(monthTx, expense);
  renderTrendChart();
  renderTxList(monthTx);
  renderDebts();
  renderGoals();
}

function renderCategoryCard(monthTx, totalExpense){
  const byCat = {};
  monthTx.filter(t=>t.type==='expense').forEach(t=>{ byCat[t.category] = (byCat[t.category]||0) + t.value; });
  const entries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

  const listEl = document.getElementById('catList');
  if(entries.length===0){
    listEl.innerHTML = '<div class="empty-note">Nenhum gasto lançado ainda. Toque em "+ novo".</div>';
  } else {
    listEl.innerHTML = entries.map(([cat,val])=>{
      const pct = totalExpense>0 ? Math.round((val/totalExpense)*100) : 0;
      const color = CAT_COLORS[cat] || '#9A9184';
      return `<div class="cat-row">
        <span class="cat-dot" style="background:${color}"></span>
        <span class="cat-name">${cat}</span>
        <span class="cat-bar-track"><span class="cat-bar-fill" style="width:${pct}%; background:${color}"></span></span>
        <span class="cat-value tabular">${fmtBRL(val)}</span>
      </div>`;
    }).join('');
  }

  const ctx = document.getElementById('catChart');
  if(catChartInst) catChartInst.destroy();
  if(entries.length===0){
    ctx.parentElement.style.display = 'none';
    return;
  }
  ctx.parentElement.style.display = 'block';
  catChartInst = new Chart(ctx, {
    type:'doughnut',
    data:{
      labels: entries.map(e=>e[0]),
      datasets:[{ data: entries.map(e=>e[1]), backgroundColor: entries.map(e=>CAT_COLORS[e[0]]||'#9A9184'), borderWidth:2, borderColor:'#FFFFFF' }]
    },
    options:{
      cutout:'68%',
      plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:(c)=> c.label+': '+fmtBRL(c.raw) } } }
    }
  });
}

function renderTrendChart(){
  const labels = [], incomeData = [], expenseData = [];
  for(let i=5;i>=0;i--){
    const d = new Date(currentDate.getFullYear(), currentDate.getMonth()-i, 1);
    labels.push(MONTHS[d.getMonth()].slice(0,3));
    const mtx = transactions.filter(t=>txInMonth(t,d));
    incomeData.push(mtx.filter(t=>t.type==='income').reduce((s,t)=>s+t.value,0));
    expenseData.push(mtx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.value,0));
  }
  const ctx = document.getElementById('trendChart');
  if(trendChartInst) trendChartInst.destroy();
  trendChartInst = new Chart(ctx, {
    type:'bar',
    data:{
      labels,
      datasets:[
        { label:'Entradas', data:incomeData, backgroundColor:'#3F6B52', borderRadius:4, maxBarThickness:16 },
        { label:'Saídas', data:expenseData, backgroundColor:'#A8462F', borderRadius:4, maxBarThickness:16 }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      scales:{ x:{ grid:{ display:false } }, y:{ grid:{ color:'#EFEAE0' }, ticks:{ callback:v=>'R$ '+v } } },
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{ size:11 } } } }
    }
  });
}

function renderTxList(monthTx){
  const el = document.getElementById('txList');
  const sorted = [...monthTx].sort((a,b)=> new Date(b.date) - new Date(a.date)).slice(0,8);
  if(sorted.length===0){ el.innerHTML = '<div class="empty-note">Nenhum lançamento neste mês.</div>'; return; }
  el.innerHTML = sorted.map(t=>{
    const color = CAT_COLORS[t.category] || '#9A9184';
    const icon = t.type==='income' ? '↑' : '↓';
    const d = new Date(t.date+'T00:00:00');
    const dateStr = d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
    return `<div class="tx-row">
      <div class="tx-icon" style="background:${color}22; color:${color}">${icon}</div>
      <div class="tx-body">
        <div class="tx-desc">${t.desc}</div>
        <div class="tx-meta">${t.category} · ${dateStr}</div>
      </div>
      <div class="tx-value ${t.type}">${t.type==='expense'?'-':'+'} ${fmtBRL(t.value)}</div>
      <button class="tx-del" onclick="deleteTx('${t.id}')">✕</button>
    </div>`;
  }).join('');
}

function renderDebts(){
  const el = document.getElementById('debtList');
  if(debts.length===0){ el.innerHTML = '<div class="card"><div class="empty-note">Nenhuma dívida cadastrada.</div></div>'; return; }
  el.innerHTML = debts.map(d=>{
    const pct = Math.min(100, Math.round((d.paid/d.installments)*100));
    const perInstall = d.total/d.installments;
    const remaining = d.installments - d.paid;
    return `<div class="card item-card">
      <div class="item-head">
        <span class="name">${d.name}</span>
        <span class="sub">${fmtBRL(perInstall)}/parcela</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="item-foot">
        <span>${d.paid} de ${d.installments} parcelas pagas</span>
        <span>Faltam ${remaining} · ${fmtBRL(remaining*perInstall)}</span>
      </div>
      <div class="item-actions">
        <button class="btn-small" onclick="advanceDebt('${d.id}')" ${d.paid>=d.installments?'disabled':''}>Marcar parcela paga</button>
        <button class="btn-small danger" onclick="deleteDebt('${d.id}')">Excluir</button>
      </div>
    </div>`;
  }).join('');
}

function renderGoals(){
  const el = document.getElementById('goalList');
  if(goals.length===0){ el.innerHTML = '<div class="card"><div class="empty-note">Nenhuma meta cadastrada.</div></div>'; return; }
  el.innerHTML = goals.map(g=>{
    const pct = Math.min(100, Math.round((g.saved/g.target)*100));
    return `<div class="card item-card">
      <div class="item-head">
        <span class="name">${g.name}</span>
        <span class="sub">${pct}%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:var(--sage)"></div></div>
      <div class="item-foot">
        <span>${fmtBRL(g.saved)} economizado</span>
        <span>Meta: ${fmtBRL(g.target)}</span>
      </div>
      <div class="item-actions">
        <button class="btn-small primary" onclick="contributeGoal('${g.id}')">+ Adicionar valor</button>
        <button class="btn-small danger" onclick="deleteGoal('${g.id}')">Excluir</button>
      </div>
    </div>`;
  }).join('');
}

/* ---------------- Transações ---------------- */
function setTxType(type){
  txType = type;
  document.getElementById('btnTypeExpense').classList.toggle('active', type==='expense');
  document.getElementById('btnTypeIncome').classList.toggle('active', type==='income');
  const sel = document.getElementById('txCat');
  const cats = type==='expense' ? EXPENSE_CATS : INCOME_CATS;
  sel.innerHTML = cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}
function openTx(){
  setTxType('expense');
  document.getElementById('txDesc').value = '';
  document.getElementById('txValue').value = '';
  document.getElementById('txDate').valueAsDate = new Date();
  openSheet('ovTx');
}
async function saveTx(){
  const desc = document.getElementById('txDesc').value.trim();
  const value = parseFloat(document.getElementById('txValue').value);
  const date = document.getElementById('txDate').value;
  const category = document.getElementById('txCat').value;
  if(!desc || !value || value<=0 || !date){ showToast('Preencha todos os campos'); return; }
  transactions.push({ id:uid(), type:txType, desc, value, category, date });
  await storeSet('transactions', transactions);
  closeSheet('ovTx');
  renderAll();
  showToast('Lançamento salvo');
}
async function deleteTx(id){
  transactions = transactions.filter(t=>t.id!==id);
  await storeSet('transactions', transactions);
  renderAll();
}

/* ---------------- Dívidas ---------------- */
function openDebt(){
  document.getElementById('dbName').value='';
  document.getElementById('dbTotal').value='';
  document.getElementById('dbInstall').value='';
  document.getElementById('dbPaid').value='0';
  openSheet('ovDebt');
}
async function saveDebt(){
  const name = document.getElementById('dbName').value.trim();
  const total = parseFloat(document.getElementById('dbTotal').value);
  const installments = parseInt(document.getElementById('dbInstall').value);
  const paid = parseInt(document.getElementById('dbPaid').value)||0;
  if(!name || !total || !installments){ showToast('Preencha todos os campos'); return; }
  debts.push({ id:uid(), name, total, installments, paid: Math.min(paid, installments) });
  await storeSet('debts', debts);
  closeSheet('ovDebt');
  renderDebts();
  showToast('Dívida salva');
}
async function advanceDebt(id){
  const d = debts.find(x=>x.id===id);
  if(d && d.paid < d.installments){ d.paid++; await storeSet('debts', debts); renderDebts(); }
}
async function deleteDebt(id){
  debts = debts.filter(d=>d.id!==id);
  await storeSet('debts', debts);
  renderDebts();
}

/* ---------------- Metas ---------------- */
function openGoal(){
  document.getElementById('glName').value='';
  document.getElementById('glTarget').value='';
  document.getElementById('glSaved').value='0';
  openSheet('ovGoal');
}
async function saveGoal(){
  const name = document.getElementById('glName').value.trim();
  const target = parseFloat(document.getElementById('glTarget').value);
  const saved = parseFloat(document.getElementById('glSaved').value)||0;
  if(!name || !target){ showToast('Preencha todos os campos'); return; }
  goals.push({ id:uid(), name, target, saved });
  await storeSet('goals', goals);
  closeSheet('ovGoal');
  renderGoals();
  showToast('Meta salva');
}
async function contributeGoal(id){
  const amount = prompt('Quanto deseja adicionar a esta meta? (R$)');
  const val = parseFloat(amount);
  if(!val || val<=0) return;
  const g = goals.find(x=>x.id===id);
  if(g){ g.saved += val; await storeSet('goals', goals); renderGoals(); showToast('Valor adicionado'); }
}
async function deleteGoal(id){
  goals = goals.filter(g=>g.id!==id);
  await storeSet('goals', goals);
  renderGoals();
}

/* ---------------- Perfil ---------------- */
async function saveProfile(){
  profile = {
    name: document.getElementById('pfName').value.trim(),
    phone: document.getElementById('pfPhone').value.trim(),
    income: parseFloat(document.getElementById('pfIncome').value)||0,
    goal: document.getElementById('pfGoal').value.trim()
  };
  await storeSet('profile', profile);
  showToast('Perfil salvo');
}
function exportData(){
  const payload = { profile, transactions, debts, goals };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'gestao-de-gastos-backup.json';
  a.click();
  URL.revokeObjectURL(url);
}
async function confirmReset(){
  if(confirm('Isso vai apagar todos os lançamentos, dívidas e metas. Deseja continuar?')){
    transactions = []; debts = []; goals = [];
    await storeSet('transactions', transactions);
    await storeSet('debts', debts);
    await storeSet('goals', goals);
    renderAll();
    showToast('Dados apagados');
  }
}

document.querySelectorAll('.overlay').forEach(ov=>{
  ov.addEventListener('click', (e)=>{ if(e.target===ov) ov.classList.remove('show'); });
});

init();
</script>
</body>
</html>
